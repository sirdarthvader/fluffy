name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  release:
    name: Version or publish packages
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for changesets
        id: changesets
        run: |
          if find .changeset -name "*.md" ! -name "README.md" | grep -q .; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check formatting
        if: steps.changesets.outputs.has_changesets == 'true'
        run: pnpm format:check

      - name: Lint
        if: steps.changesets.outputs.has_changesets == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.changesets.outputs.has_changesets == 'true'
        run: pnpm typecheck

      - name: Smoke test example app
        if: steps.changesets.outputs.has_changesets == 'true'
        run: pnpm smoke:example

      - name: Version packages
        if: steps.changesets.outputs.has_changesets == 'true'
        run: pnpm version-packages

      - name: Update lockfile
        if: steps.changesets.outputs.has_changesets == 'true'
        run: pnpm install --lockfile-only

      - name: Commit version changes
        if: steps.changesets.outputs.has_changesets == 'true'
        run: |
          git config user.name "fluffejs-release-bot[bot]"
          git config user.email "fluffejs-release-bot[bot]@users.noreply.github.com"
          git add .
          git commit -m "Version packages"

      - name: Push version commit
        if: steps.changesets.outputs.has_changesets == 'true'
        run: |
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upgrade npm for trusted publishing
        if: steps.changesets.outputs.has_changesets == 'false'
        run: npm install -g npm@11

      - name: Publish packages
        if: steps.changesets.outputs.has_changesets == 'false'
        run: pnpm release
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Push release tags
        if: steps.changesets.outputs.has_changesets == 'false'
        run: git push origin --tags
